<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Bicycle Simulation - Hardcore Final Fix (Version 27)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin:0; overflow:hidden; font-family: sans-serif; background:#a0d8ef; user-select: none; -webkit-user-select: none; }
        #ui { position:absolute; top:20px; left:20px; background:rgba(255,255,255,0.8); padding:15px; border-radius:10px; z-index:100; border: 1px solid #999; }
        #msg { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:80%; text-align:center; font-size:40px; font-weight:bold; pointer-events:none; z-index:1000; display:none; }

        .clear { color: #f1c40f; text-shadow: 2px 2px 10px #000; display: block !important; }
        #overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); display:none; z-index:500; }
        #timer-display { font-size: 24px; font-weight: bold; color: #e74c3c; }
        #coin-display { font-size: 18px; font-weight: bold; color: #d4af37; margin-top: 5px; }
        
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 160px;
            z-index: 600;
            display: none;
            pointer-events: none;
        }
        .btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #555;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            background: rgba(200, 200, 200, 0.9);

        #btn-s { left: 80px; bottom: 20px; width: 50px; height: 50px; font-size: 20px; }
        #btn-a { left: 20px; bottom: 20px; width: 50px; height: 50px; font-size: 20px; }
        #btn-d { left: 140px; bottom: 20px; width: 50px; height: 50px; font-size: 20px; }
        #btn-q { right: 85px; bottom: 40px; width: 55px; height: 55px; font-size: 16px; }
        #btn-e { right: 20px; bottom: 40px; width: 55px; height: 55px; font-size: 16px; }
        
        /* 衝突時の赤フラッシュオーバーレイ */
        #hit-flash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center,
                rgba(255, 20, 0, 0.45) 0%,
                rgba(160, 0, 0, 0.92) 100%);
            opacity: 0;
            pointer-events: none;
            z-index: 450;
        }
        #retry-overlay-btn {
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            background: #e67e22;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            display: none;
            z-index: 1001;
            cursor: pointer;
        }
        /* ===== スタート画面 ===== */
        #start-screen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(160deg, rgba(4,16,38,0.94) 0%, rgba(8,28,18,0.94) 100%);
            z-index: 900;
            display: flex; align-items: center; justify-content: center;
            font-family: sans-serif;
            color: #fff;
        }
        .key-cap {
            width: 44px; height: 44px;
            background: linear-gradient(180deg, #f5f5f5 0%, #c0c0c0 100%);
            border: 2px solid #888; border-bottom: 5px solid #444;
            border-radius: 7px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 17px; font-weight: bold; color: #222;
            box-shadow: 0 3px 7px rgba(0,0,0,0.55);
            margin: 2px;
        }
        @keyframes startBlink {
            0%,100%{ opacity:1; } 50%{ opacity:0.3; }
        }
    </style>
</head>

<div id="hit-flash"></div>

<!-- ===== スタート画面 ===== -->

                font-size:13px; color:#e8e8e8; text-align:left; line-height:2.0;">

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

let isGameOver = false;
let coins = 0;
let startTime = Date.now();
let elapsedTime = 0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa0d8ef);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(50, 50, 20);
sun.castShadow = true;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.7));

const grassGeo = new THREE.PlaneGeometry(1000, 1000);
const grassMat = new THREE.MeshLambertMaterial({ color: 0x7cfc00 });
const grass = new THREE.Mesh(grassGeo, grassMat);
grass.rotation.x = -Math.PI / 2;
grass.receiveShadow = true;
scene.add(grass);

const createRoad = (x, z, w, d) => {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshLambertMaterial({ color: 0x333333 }));
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(x, 0.01, z);
    scene.add(mesh);
};
createRoad(0, 60, 10, 120);    
createRoad(40, 0, 90, 10);    
createRoad(85, -60, 10, 130);  
createRoad(-100, 0, 240, 10);      
createRoad(85, 0, 40, 10);    
createRoad(40, -60, 300, 10);  

const createNavLine = (x, z, w, d) => {
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ color: 0x3498db }));
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(x, 0.02, z);
    scene.add(mesh);
};
createNavLine(0, 60, 1, 120);
createNavLine(42.5, 0, 86, 1);
createNavLine(85, -60, 1, 120);

function createTunnel(x, z) {
    const tunnel = new THREE.Mesh(new THREE.BoxGeometry(12, 8, 12), new THREE.MeshLambertMaterial({color: 0x222222}));
    tunnel.position.set(x, 4, z);
    scene.add(tunnel);
}
createTunnel(-220, 0); createTunnel(120, 0);
createTunnel(-110, -60); createTunnel(190, -60);

const wallMat = new THREE.MeshLambertMaterial({ color: 0xeeeeee });
const walls = [
    {x:-10, z:11, w:10, d:10}, {x:10, z:11, w:10, d:10},     
    {x:73, z:-49, w:14, d:12}, {x:95, z:-49, w:10, d:12}
];
walls.forEach(w => {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w.w, 7, w.d), wallMat);
    wall.position.set(w.x, 3.5, w.z);
    scene.add(wall);
});

// ==========================================
// 【修正①】電柱システム - よりリアルに
// ==========================================
function createUtilityPole(x, z, rotY = 0) {
    const group = new THREE.Group();

    // 木製ポール本体（茶色系）
    const poleMat = new THREE.MeshLambertMaterial({color: 0x7a5c3a});
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.20, 13, 8), poleMat);
    pole.position.y = 6.5;
    group.add(pole);

    // ポールの金属バンド（固定用）
    const bandMat = new THREE.MeshLambertMaterial({color: 0x888888});
    for (const bandY of [3.5, 7.0, 10.5]) {
        const band = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.18, 8), bandMat);
        band.position.y = bandY;
        group.add(band);
    }

    // 上段横腕木（高圧電力線用・長め）
    const armMat = new THREE.MeshLambertMaterial({color: 0x5c4033});
    const arm1 = new THREE.Mesh(new THREE.BoxGeometry(5.5, 0.22, 0.22), armMat);
    arm1.position.set(0, 12.4, 0);
    group.add(arm1);

    // 下段横腕木（低圧・通信線用）
    const arm2 = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.18, 0.18), armMat);
    arm2.position.set(0, 10.5, 0);
    group.add(arm2);

    // 上段碍子（陶器製・縦型）
    const insGeo = new THREE.CylinderGeometry(0.10, 0.13, 0.35, 8);
    const insMat = new THREE.MeshLambertMaterial({color: 0xd4c89a}); // 磁器・淡黄色
    for (const [ix, iy] of [[-2.3, 12.4], [-0.8, 12.4], [0.8, 12.4], [2.3, 12.4]]) {
        const ins = new THREE.Mesh(insGeo, insMat);
        ins.position.set(ix, iy + 0.25, 0);
        group.add(ins);
        // 碍子の傘（フランジ）
        const flange = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.06, 8), insMat);
        flange.position.set(ix, iy + 0.08, 0);
        group.add(flange);
    }

    // 下段碍子
    for (const [ix, iy] of [[-1.2, 10.5], [0, 10.5], [1.2, 10.5]]) {
        const ins = new THREE.Mesh(insGeo, insMat);
        ins.position.set(ix, iy + 0.25, 0);
        group.add(ins);
    }

    // 変圧器（トランス）本体 - 円柱形・明るいスチールグレー
    const transMat = new THREE.MeshLambertMaterial({color: 0x607080});
    const transBody = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 1.4, 10), transMat);
    transBody.position.set(0.9, 8.8, 0);
    group.add(transBody);

    // トランスの上蓋（やや明るく）
    const transCap = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.58, 0.12, 10), 
        new THREE.MeshLambertMaterial({color: 0x7a8a99}));
    transCap.position.set(0.9, 9.56, 0);
    group.add(transCap);

    // トランス固定バンド
    const transBand = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.56, 0.12, 10), bandMat);
    transBand.position.set(0.9, 8.3, 0);
    group.add(transBand);

    group.position.set(x, 0, z);
    group.rotation.y = rotY;
    scene.add(group);
    return group;
}

function createWire(x1, y1, z1, x2, y2, z2) {
    const points = [];
    const segments = 10;
    for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const sag = Math.sin(t * Math.PI) * 0.3;
        points.push(new THREE.Vector3(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t - sag, z1 + (z2 - z1) * t));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({color: 0x222222}));
    scene.add(line);
}

const polePositionsV = [115, 85, 55, 25];
polePositionsV.forEach(z => createUtilityPole(-5.2, z));
for (let i = 0; i < polePositionsV.length - 1; i++) {
    createWire(-5.2, 12.4, polePositionsV[i], -5.2, 12.4, polePositionsV[i+1]);
    createWire(-5.2, 10.5, polePositionsV[i], -5.2, 10.5, polePositionsV[i+1]);
}

const polePositionsV2 = [-15, -45, -75, -105];
polePositionsV2.forEach(z => createUtilityPole(90.8, z));
for (let i = 0; i < polePositionsV2.length - 1; i++) {
    createWire(90.8, 12.4, polePositionsV2[i], 90.8, 12.4, polePositionsV2[i+1]);
    createWire(90.8, 10.5, polePositionsV2[i], 90.8, 10.5, polePositionsV2[i+1]);
}

// ==========================================
// 【修正②】止まれ標識 - 目立たないよう小さく
// ==========================================
function createStopSignTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 256, 256);
    ctx.beginPath();
    ctx.moveTo(128, 248); ctx.lineTo(8, 14); ctx.lineTo(248, 14);
    ctx.closePath();
    ctx.strokeStyle = 'white'; ctx.lineWidth = 18; ctx.stroke();
    ctx.fillStyle = '#cc0000'; ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = 'bold 54px sans-serif'; 
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('止まれ', 128, 92);
    return new THREE.CanvasTexture(canvas);
}
const stopSignTexture = createStopSignTexture();

function createStopSign(x, z) {
    const group = new THREE.Group();
    // ポールを短く・細く
    const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.05, 3.2, 8),
        new THREE.MeshLambertMaterial({color: 0xaaaaaa})
    );
    pole.position.y = 1.6;
    group.add(pole);
    // 標識本体を小さく（0.65×0.65 → 目立ちにくいサイズ）
    const signMat = new THREE.MeshBasicMaterial({
        map: stopSignTexture, transparent: true, side: THREE.DoubleSide
    });
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.65), signMat);
    sign.position.set(0, 3.3, 0.05);
    group.add(sign);
    group.position.set(x, 0, z);
    scene.add(group);
}
createStopSign(4.5, 16.5);          
createStopSign(88.5, -45);          

const createStopLine = (x, z, w, d) => {
    const line = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshLambertMaterial({ color: 0xffffff }));
    line.rotation.x = -Math.PI/2;
    line.position.set(x, 0.05, z);
    scene.add(line);
};
createStopLine(0, 13, 8, 1.2);    
createStopLine(85, -47, 8, 1.2);  

function createRoadTextTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 128, 512);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 95px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.save();
    ctx.scale(1, 1.8);
    ctx.fillText('止', 64, 70);
    ctx.fillText('ま', 64, 150);
    ctx.fillText('れ', 64, 230);
    ctx.restore();
    return new THREE.CanvasTexture(canvas);
}
const roadTextTexture = createRoadTextTexture();

const createRoadTextMarking = (x, z, rotY = 0) => {
    const textMat = new THREE.MeshBasicMaterial({
        map: roadTextTexture,
        transparent: true,
        side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 8.8), textMat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.rotation.z = rotY;
    mesh.position.set(x, 0.06, z);
    scene.add(mesh);
};
createRoadTextMarking(0, 22, 0);
createRoadTextMarking(85, -38, 0);

// ==========================================
// 【修正④】安全大学 正門・校舎
// ==========================================

// 大学名縦書きサイン用テクスチャ
function createUniversitySignTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 160;
    canvas.height = 640;
    const ctx = canvas.getContext('2d');
    // 濃紺の背景
    ctx.fillStyle = '#0c1a2e';
    ctx.fillRect(0, 0, 160, 640);
    // 金色の二重枠線
    ctx.strokeStyle = '#c9a840';
    ctx.lineWidth = 6;
    ctx.strokeRect(7, 7, 146, 626);
    ctx.lineWidth = 2;
    ctx.strokeRect(13, 13, 134, 614);
    // 金色の縦書き文字
    ctx.fillStyle = '#d4a830';
    ctx.font = 'bold 68px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const chars = ['安', '全', '大', '學'];
    const spacing = 614 / chars.length;
    chars.forEach((ch, i) => {
        ctx.fillText(ch, 80, 16 + spacing * (i + 0.5));
    });
    return new THREE.CanvasTexture(canvas);
}
const uniSignTex = createUniversitySignTexture();

// 煉瓦テクスチャ（学校本体用）
function createBrickTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#9b4a35';
    ctx.fillRect(0, 0, 256, 256);
    ctx.fillStyle = '#8a3e2c';
    ctx.strokeStyle = '#d4c0a0';
    ctx.lineWidth = 1.5;
    const brickH = 24, brickW = 64;
    for (let row = 0; row * brickH < 256; row++) {
        const offset = (row % 2) * (brickW / 2);
        for (let col = -1; col * brickW < 256 + brickW; col++) {
            const bx = col * brickW + offset;
            const by = row * brickH;
            ctx.fillRect(bx + 1, by + 1, brickW - 2, brickH - 2);
            ctx.strokeRect(bx + 1, by + 1, brickW - 2, brickH - 2);
        }
    }
    return new THREE.CanvasTexture(canvas);
}
const brickTex = createBrickTexture();
brickTex.wrapS = brickTex.wrapT = THREE.RepeatWrapping;
brickTex.repeat.set(6, 3);

// 大学校舎グループ
const schoolGroup = new THREE.Group();

// ---- 校舎本体（大学風・白系ベージュ） ----
const schoolBodyMat = new THREE.MeshLambertMaterial({ color: 0xdacfba });
const schoolBody = new THREE.Mesh(new THREE.BoxGeometry(56, 20, 16), schoolBodyMat);
schoolBody.position.set(85, 10, -148);
schoolBody.castShadow = true;
schoolBody.receiveShadow = true;
schoolGroup.add(schoolBody);

// 中央エントランス部（少し前に突き出して立体感）
const entranceMat = new THREE.MeshLambertMaterial({ color: 0xc8bda8 });
const entrance = new THREE.Mesh(new THREE.BoxGeometry(14, 22, 4), entranceMat);
entrance.position.set(85, 11, -140);
entrance.castShadow = true;
schoolGroup.add(entrance);

// 屋上パラペット
const parapet = new THREE.Mesh(new THREE.BoxGeometry(58, 1.0, 17), new THREE.MeshLambertMaterial({ color: 0xb0a898 }));
parapet.position.set(85, 20.5, -148);

function createTree(x, z) {
    const group = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.5, 6), new THREE.MeshLambertMaterial({color: 0x5c4033}));
    trunk.position.y = 0.75;
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(1.2, 8, 8), new THREE.MeshLambertMaterial({color: 0x2e8b57}));
    leaves.position.y = 2.0;
    group.add(trunk, leaves);
    group.position.set(x, 0, z);
    scene.add(group);
}

function createResidentialPlot(x, z, rotY = 0, color = 0xffffff) {
    const plotGroup = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(9, 6.5, 9), new THREE.MeshLambertMaterial({color: color}));
    body.position.y = 3.25;
    body.castShadow = true;
    body.receiveShadow = true;
    const roof = new THREE.Mesh(new THREE.ConeGeometry(7.5, 4, 4), new THREE.MeshLambertMaterial({color: 0xaa4433}));
    roof.position.y = 8.5; 
    roof.rotation.y = Math.PI/4;
    roof.castShadow = true;
    const winMat = new THREE.MeshLambertMaterial({color: 0xadd8e6, emissive: 0x112233});
    const win = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), winMat);
    win.position.set(2, 4, 4.51);
    const doorMat = new THREE.MeshLambertMaterial({color: 0x5c4033});
    const door = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2.5), doorMat);
    door.position.set(-2, 1.25, 4.51);
    plotGroup.add(body, roof, win, door);
    const wallMat2 = new THREE.MeshLambertMaterial({color: 0xcccccc});
    const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 11), wallMat2);
    wallL.position.set(-5.5, 0.6, 0);
    const wallR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 11), wallMat2);
    wallR.position.set(5.5, 0.6, 0);
    const wallB = new THREE.Mesh(new THREE.BoxGeometry(11.4, 1.2, 0.4), wallMat2);
    wallB.position.set(0, 0.6, -5.5);
    plotGroup.add(wallL, wallR, wallB);
    plotGroup.rotation.y = rotY;
    plotGroup.position.set(x, 0, z);
    scene.add(plotGroup);
    const cos = Math.cos(rotY);
    const sin = Math.sin(rotY);
    createTree(x + (4 * sin + 4 * cos), z + (4 * cos - 4 * sin));
}

function createRealisticCar(colorHex) {
    const carGroup = new THREE.Group();
    const bodyMat = new THREE.MeshLambertMaterial({color: colorHex, transparent: true, opacity: 1.0});
    const body = new THREE.Mesh(new THREE.BoxGeometry(4, 1.2, 8), bodyMat);
    body.position.y = 0.8;
    carGroup.add(body);
    const roofMat = new THREE.MeshLambertMaterial({color: 0xffffff, transparent: true, opacity: 1.0});
    const roof = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1, 4), roofMat);
    roof.position.y = 1.9;
    roof.position.z = -0.5;
    carGroup.add(roof);
    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.5, 12);
    const wheelMat = new THREE.MeshLambertMaterial({color: 0x333333, transparent: true, opacity: 1.0});
    const wheelPositions = [[2,0.4,2.5], [-2,0.4,2.5], [2,0.4,-2.5], [-2,0.4,-2.5]];
    wheelPositions.forEach(p => {
        const w = new THREE.Mesh(wheelGeo, wheelMat);
        w.rotation.z = Math.PI/2;
        w.position.set(p[0], p[1], p[2]);
        carGroup.add(w);
    });
    const lightMat = new THREE.MeshLambertMaterial({color: 0xffffaa, transparent: true, opacity: 1.0});
    const light = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.3, 0.2), lightMat);
    light.position.set(0, 0.8, 4);
    carGroup.add(light);
    return carGroup;
}

// 衝突演出用：シェイク基準カメラ座標
let shakeBaseX = 0, shakeBaseY = 1.8, shakeBaseZ = 0;

// ==========================================
// 衝突演出：赤フラッシュ＋カメラシェイク
// ==========================================
function startCollisionEffect(text) {
    // --- 1) 画面を赤くフラッシュ ---
    const flash = document.getElementById('hit-flash');
    flash.style.transition = 'none';
    flash.style.opacity = '1';
    // 0.15秒後にゆっくりフェードアウト開始
    setTimeout(() => {
        flash.style.transition = 'opacity 1.6s ease-out';
        flash.style.opacity = '0';
    }, 150);

    // --- 2) カメラシェイク（独自rAFループ） ---
    // 衝突瞬間のカメラ位置を基準として保存
    shakeBaseX = camera.position.x;
    shakeBaseY = camera.position.y;
    shakeBaseZ = camera.position.z;
    const baseRotY = camera.rotation.y;

    let magnitude = 0.60;   // 初期振幅
    const decay     = 0.84; // 減衰率（大きいほど長く揺れる）

    const shakeLoop = () => {
        magnitude *= decay;
        // XZ方向に大きく、Y方向に小さく揺らす
        camera.position.set(
            shakeBaseX + (Math.random() - 0.5) * magnitude * 2.2,
            shakeBaseY + (Math.random() - 0.5) * magnitude * 0.5,
            shakeBaseZ + (Math.random() - 0.5) * magnitude * 2.2
        );
        // 向きも少し揺らす（首ブレ感）
        camera.rotation.y = baseRotY + (Math.random() - 0.5) * magnitude * 0.25;

        renderer.render(scene, camera);

        if (magnitude > 0.006) {
            requestAnimationFrame(shakeLoop);
        } else {
            // シェイク完了 → カメラを元に戻してゲームオーバー画面を表示
            camera.position.set(shakeBaseX, shakeBaseY, shakeBaseZ);
            camera.rotation.y = baseRotY;
            renderer.render(scene, camera);
            triggerEnd(text, false);
        }
    };
    requestAnimationFrame(shakeLoop);
}

function update() {
    if (isGameOver) return;

    // スタート前はシーンだけ描画してループ待機
    if (!gameStarted) {
        renderer.render(scene, camera);
        requestAnimationFrame(update);
        return;
    }

    elapsedTime = (Date.now() - startTime) / 1000;
    document.getElementById('timer-display').innerText = `⏱️ TIME: ${elapsedTime.toFixed(2)}s`;

    if (keys['w']) player.speed = Math.min(player.speed + 0.005, 0.25); 
    else if (keys['s']) player.speed = Math.max(player.speed - 0.02, 0);
    else player.speed *= 0.96;
    
    let targetRot = 0;
    if (keys['a']) { player.angle += 0.025; targetRot = 0.2; }
    if (keys['d']) { player.angle -= 0.025; targetRot = -0.2; }
    handleGroup.rotation.z += (targetRot - handleGroup.rotation.z) * 0.1;

    let nextX = player.x - Math.sin(player.angle) * player.speed;
    let nextZ = player.z - Math.cos(player.angle) * player.speed;

    let onRoad = false;
    if (player.z > -5 && Math.abs(nextX) < 4.5) onRoad = true;                    
    if (nextZ > -5 && nextZ < 5 && nextX >= -5 && nextX <= 90) onRoad = true;     
    if (nextX > 80 && nextX < 90 && nextZ <= 5 && nextZ >= -130) onRoad = true;   
    if (onRoad) { player.x = nextX; player.z = nextZ; }

    let targetLookAngle = 0, targetLeanX = 0, targetLeanZ = 0;
    let isHeadingEast = (player.z > -10 && player.z < 10 && player.x > 5);

    if (keys['q']) {
        targetLookAngle = Math.PI / 2;
        if (isHeadingEast) targetLeanX = 4.0; else targetLeanZ = -4.0;
    } else if (keys['e']) {
        targetLookAngle = -Math.PI / 2;
        if (isHeadingEast) targetLeanX = 4.0; else targetLeanZ = -4.0;
        
        if (player.x > 70 && player.x < 95 && player.z > -55 && player.z < -30) {
            hasCheckedRight = true;
            if (!car2Triggered && !car2Warped) {
                car2Warped = true;
                car2Triggered = true;
                car2Visible = true;
                setCarVisibility(car2, true);
                carX2 = 180;
            }
        }
    }
    
    lookAngle += (targetLookAngle - lookAngle) * 0.2;
    leanZ += (targetLeanZ - leanZ) * 0.2;
    leanX += (targetLeanX - leanX) * 0.2;

    camera.position.set(player.x + leanX, 1.8, player.z + leanZ);
    camera.rotation.y = player.angle + lookAngle;

    carX1 += 0.25; 
    if (carX1 > 120) carX1 = -220; 
    car1.position.set(carX1, 0, 0); car1.rotation.y = Math.PI/2; 
    
    const nearSecondIntersection = (player.x > 70 && player.x < 95 && player.z > -65 && player.z < -30);

    if (nearSecondIntersection) {
        if (!car2Warped && player.z < -55) {
            car2Triggered = true;
            car2Visible = true;
            setCarVisibility(car2, true);
        }
    }

    if (car2Triggered) {
        carX2 -= car2Warped ? 1.5 : 1.0; 
    } else {
        if (!car2Warped) {
            carX2 = 98;
        }
    }
    car2.position.set(carX2, 0, -60); car2.rotation.y = -Math.PI/2;

    const checkZones = [
        { active: (player.x < 10), zLine: 13, pPos: player.z, triggerPass: (player.z < 10) },
        { active: (player.x > 70), zLine: -47, pPos: player.z, triggerPass: (player.z < -50) }
    ];

    checkZones.forEach((zone, i) => {
        if (!zone.active) return;
        const inStopZone = (zone.pPos > zone.zLine - 6 && zone.pPos < zone.zLine + 10);
        if (inStopZone && Math.abs(player.speed) < 0.005 && player.lineState[i] === 0) {
            player.lineState[i] = 1; 
            coins += 200; 
            document.getElementById('coin-display').innerText = `🪙 BONUS: ${coins}`;
        }
        if (zone.triggerPass && player.lineState[i] !== 2) {
            if (player.lineState[i] === 0) {
                triggerEnd("GAME OVER<br><span style='font-size:18px;'>一時停止（速度0）をせずに交差点に進入しました！</span>", false);
            }
            player.lineState[i] = 2; 
        }
    });

    const bikePos = new THREE.Vector3(player.x, 1, player.z);
    let hitCar1 = bikePos.distanceTo(new THREE.Vector3(car1.position.x, 1, car1.position.z)) < 4.5;
    let hitCar2 = car2Visible && bikePos.distanceTo(new THREE.Vector3(car2.position.x, 1, car2.position.z)) < 4.5;

    if (hitCar1 || hitCar2) {
        isGameOver = true; // mainループをここで止める
        let accidentText;
        if (player.x > 70) {
            if (!hasCheckedRight) {
                accidentText = "ACCIDENT<br><span style='font-size:18px;'>形だけ止まっても意味がありません！<br>Eボタンで右側の安全を確認するまで進んではいけません。</span><br><span style='font-size:22px; color:#ffe066; background:rgba(0,0,0,0.4); padding:4px 12px; border-radius:6px; display:inline-block; margin-top:8px;'>💡 交差点進入前に【 Q / E 】キーで左右を確認しよう！</span>";
            } else {
                accidentText = "ACCIDENT<br><span style='font-size:18px;'>車の直前に飛び出してしまいました！<br>安全を確認した後は車が通り過ぎるのを待ちましょう。</span><br><span style='font-size:22px; color:#ffe066; background:rgba(0,0,0,0.4); padding:4px 12px; border-radius:6px; display:inline-block; margin-top:8px;'>💡 【 Q / E 】キーで確認してから、車が過ぎるまで待とう！</span>";
            }
        } else {
            accidentText = "ACCIDENT<br><span style='font-size:18px;'>交差点の確認を怠りました。</span>";
        }
        startCollisionEffect(accidentText);
        return; // このフレームの残り処理をスキップ
    }

    if (player.z < -115 && player.x > 75) {
        let finalTime = Math.max(0, elapsedTime - (coins / 100));
        triggerEnd("🎉 GOAL!<br>学校に到着しました！<br>記録: " + elapsedTime.toFixed(2) + "秒<br><span style='font-size:20px;'>安全ボーナス適用後: " + finalTime.toFixed(2) + "秒</span>", true);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(update);
}

function triggerEnd(text, success) {
    isGameOver = true;
    document.getElementById('overlay').style.display = 'block';
    const msg = document.getElementById('msg');
    msg.innerHTML = text + "<br><span style='font-size:20px;'>Rキー または ボタンでリトライ</span>";
    msg.className = success ? "clear" : "game-over";
    msg.style.display = 'block';
    document.getElementById('retry-overlay-btn').style.display = 'block';
}

update();
